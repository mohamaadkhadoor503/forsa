{% load i18n %}<fieldset class="filters__group" style="border:0;margin:0;padding-inline:0">
  <legend class="filters__title">{{ title }}</legend>
  <label class="check"><input type="radio" name="{{ name }}" value="" {% if not current %}checked{% endif %}> {% translate "الكل" %}</label>
  {% for value, label in options %}<label class="check"><input type="radio" name="{{ name }}" value="{{ value }}" {% if current == value %}checked{% endif %}> {{ label }}</label>{% endfor %}
</fieldset>
